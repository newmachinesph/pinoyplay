name: pinoyplay
# Local score database. Development credentials; the port is bound to this machine only.
services:
  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: pinoyplay
      MYSQL_USER: pinoyplay
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localdev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localroot}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - pinoyplay-mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  pinoyplay-mysql:
